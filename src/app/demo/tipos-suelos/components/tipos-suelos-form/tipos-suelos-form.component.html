    <form [formGroup]="form" (ngSubmit)="submit()" autocomplete="off">
        <div class="mb-3">
            <label class="block mb-2 font-bold">Nombre</label>
            <input 
                pInputText 
                class="w-full"
                formControlName="nombre_tipo_suelo" 
            />
            @if (form.controls.nombre_tipo_suelo.invalid && form.controls.nombre_tipo_suelo.touched) {
                <small class="text-red-500">El nombre es requerido</small>
            }
        </div>

        <div class="mb-3">
            <label class="block mb-2 font-bold">Capacidad retención</label>
            <input 
                pInputText
                class="w-full"
                formControlName="capacidad_retencion_agua" 
            />
        </div>

        <div class="mb-3">
            <label class="block mb-2 font-bold">Drenaje</label>
            <input 
                pInputText
                class="w-full"
                formControlName="drenaje" />
        </div>

        <div class="flex justify-end gap-2 mt-4">
            <button 
                pButton
                label="Cancelar"
                class="p-button-text" 
                type="button" 
                (click)="cancel()">
            </button>
            <button 
                pButton
                label="Guardar"
                type="submit">
            </button>
        </div>
    </form>
</p-dialog>
